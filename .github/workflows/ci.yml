name: CI Workflow for Gym Progress Tracker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: secure_production_password
          POSTGRES_DB: gym_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Execute Prisma Migrations & Client Generation
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://gym_user:secure_production_password@localhost:5432/gym_tracker?schema=public"
        run: |
          npx prisma migrate deploy
          npx prisma generate

      - name: Run Backend ESLint
        working-directory: backend
        run: npm run lint

      - name: Run Backend Integration Tests
        working-directory: backend
        env:
          PORT: 5001
          NODE_ENV: test
          DATABASE_URL: "postgresql://gym_user:secure_production_password@localhost:5432/gym_tracker?schema=public"
          JWT_SECRET: "test-jwt-secret-key-1234567890-super-secret"
          CORS_ORIGIN: "http://localhost:5173"
        run: npm test

  frontend-ci:
    name: Frontend Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

  docker-security:
    name: Docker Build and Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calculate Image Tags
        id: image-tags
        shell: bash
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Scan Source Files and Dependencies
        uses:  aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Build Backend Image
        run: |
          docker build \
            --tag fitpulse-backend:${{ steps.image-tags.outputs.sha }} \
            --file backend/Dockerfile \
            backend

      - name: Build Frontend Image
        run: |
          docker build \
            --tag fitpulse-frontend:${{ steps.image-tags.outputs.sha }} \
            --file frontend/Dockerfile \
            frontend

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fitpulse-backend:${{ steps.image-tags.outputs.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fitpulse-frontend:${{ steps.image-tags.outputs.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Log in to Docker Hub
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Images for Docker Hub
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ steps.image-tags.outputs.sha }}
        run: |
          docker tag fitpulse-backend:${IMAGE_SHA} \
            "${DOCKERHUB_USERNAME}/fitpulse-backend:${IMAGE_SHA}"

          docker tag fitpulse-frontend:${IMAGE_SHA} \
            "${DOCKERHUB_USERNAME}/fitpulse-frontend:${IMAGE_SHA}"

      - name: Push SHA-Tagged Images
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master')
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_SHA: ${{ steps.image-tags.outputs.sha }}
        run: |
          docker push "${DOCKERHUB_USERNAME}/fitpulse-backend:${IMAGE_SHA}"
          docker push "${DOCKERHUB_USERNAME}/fitpulse-frontend:${IMAGE_SHA}"
